[project]
name = "jobtracker"
version = "0.1.0"
description = "Local job application tracker with evidence folders, Markdown records, reports, and optional local LLM extraction."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "pypdf>=5",
    "reportlab>=4.2",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30.0",
    "typer>=0.12.0",
    "prompt-toolkit>=3.0.0",
    "PyYAML>=6.0.0",
    "rich>=13.0.0",
    "openai>=1.0.0"
]

[project.scripts]
job = "jobtracker.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jobtracker"]

[tool.setuptools.package-data]
jobtracker = ["web/static/*", "assets/fonts/*"]
